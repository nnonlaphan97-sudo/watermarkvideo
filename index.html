<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Videomark</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{background:#0e1017;color:#fff;margin:0;padding:24px 16px 55px}main{max-width:560px;margin:auto}h1{font-size:27px;margin:0 0 6px}.muted{color:#adb3c4;font-size:13px;line-height:1.5}.panel{background:#1c202b;border:1px solid #343948;border-radius:19px;padding:16px;margin-top:18px}label{display:block;font-weight:600;margin-bottom:10px}input[type=file]{width:100%;font-size:14px}input[type=range]{width:100%;accent-color:#5094ff}.stage{position:relative;margin:20px auto 0;max-height:60vh;max-width:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;border-radius:10px;display:none}.stage video{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}.stage img{position:absolute;top:35%;left:35%;width:30%;height:auto;touch-action:none;user-select:none;pointer-events:none}button,.download{display:block;width:100%;border:0;border-radius:13px;background:#3987ff;color:white;font-size:17px;font-weight:700;padding:15px;text-align:center;text-decoration:none;margin-top:14px}button:disabled{opacity:.45}.download{background:#20a776}#status{white-space:pre-wrap;line-height:1.5;color:#cdd5e7;font-size:14px}#progress{width:100%;margin-top:12px;display:none}#save{display:none}.small{font-size:12px;color:#adb3c4}</style></head><body><main><h1>Videomark</h1><p class="muted">เลือกคลิป วางลายน้ำ แล้วสร้างไฟล์ใหม่ได้ในหน้าเดียว ไม่ใช้ a-Shell หรือ Scriptable</p><div class="panel"><label>1. เลือกวิดีโอ</label><input id="videoFile" type="file" accept="video/*"><label style="margin-top:20px">2. เลือกรูป PNG ลายน้ำ</label><input id="logoFile" type="file" accept="image/png"></div><div id="stage" class="stage"><video id="video" controls playsinline preload="metadata"></video><img id="logo" alt="ลายน้ำ"></div><div class="panel"><label id="sizeText">ขนาดลายน้ำ 30%</label><input id="size" type="range" min="3" max="90" value="30"><p class="muted">ลากลายน้ำบนภาพเพื่อย้ายตำแหน่ง หรือบีบสองนิ้วเพื่อปรับขนาด</p><button id="render" disabled>3. สร้างวิดีโอพร้อมลายน้ำ</button><progress id="progress" max="100" value="0"></progress><p id="status">รอเลือกวิดีโอและ PNG</p><a id="save" class="download" download="videomark.mp4">บันทึก / แชร์วิดีโอ</a><p class="small">ประมวลผลบนอุปกรณ์ของคุณ ไม่อัปโหลดคลิปไปเซิร์ฟเวอร์ ต้องใช้อินเทอร์เน็ตครั้งแรกเพื่อโหลดตัวประมวลผล</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script><script>
const $=id=>document.getElementById(id);let vf=null,lf=null,videoURL=null,logoURL=null,outURL=null,x=.35,y=.35,w=.30,ratio=1,touches=null,ff=null;
const stage=$('stage'),logo=$('logo'),video=$('video');
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function geometry(){const sw=stage.clientWidth,sh=stage.clientHeight;if(!sw||!sh)return;const lh=logo.naturalWidth?logo.naturalHeight/logo.naturalWidth:1;const h=w*sw*lh/sh;w=clamp(w,.03,Math.min(.9,sh/(sw*lh)));x=clamp(x,0,1-w);y=clamp(y,0,Math.max(0,1-w*sw*lh/sh));logo.style.width=w*100+'%';logo.style.left=x*100+'%';logo.style.top=y*100+'%';$('size').value=Math.round(w*100);$('sizeText').textContent='ขนาดลายน้ำ '+Math.round(w*100)+'%'}
function resetOutput(){if(outURL)URL.revokeObjectURL(outURL);outURL=null;$('save').style.display='none';$('status').textContent='พร้อมวางลายน้ำ';$('progress').style.display='none'}
function ready(){const ok=!!(vf&&lf);$('render').disabled=!ok;stage.style.display=vf?'block':'none';if(ok)resetOutput()}
$('videoFile').onchange=e=>{vf=e.target.files[0]||null;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=vf?URL.createObjectURL(vf):null;video.src=videoURL||'';video.load();ready()};
$('logoFile').onchange=e=>{lf=e.target.files[0]||null;if(logoURL)URL.revokeObjectURL(logoURL);logoURL=lf?URL.createObjectURL(lf):null;logo.src=logoURL||'';ready()};
logo.onload=()=>{x=(1-w)/2;y=.35;geometry()};video.onloadedmetadata=()=>{ratio=video.videoWidth/video.videoHeight;stage.style.aspectRatio=String(ratio);geometry()};window.onresize=geometry;
$('size').oninput=e=>{w=Number(e.target.value)/100;geometry()};
function point(t){return {x:t.clientX,y:t.clientY}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
stage.addEventListener('touchstart',e=>{if(!lf)return;e.preventDefault();touches=[...e.touches].map(point)},{passive:false});
stage.addEventListener('touchmove',e=>{if(!lf||!touches)return;e.preventDefault();const now=[...e.touches].map(point);if(now.length===1&&touches.length===1){x+=(now[0].x-touches[0].x)/stage.clientWidth;y+=(now[0].y-touches[0].y)/stage.clientHeight}else if(now.length===2&&touches.length===2){w=clamp(w*dist(now[0],now[1])/Math.max(1,dist(touches[0],touches[1])),.03,.9)}touches=now;geometry()},{passive:false});stage.addEventListener('touchend',()=>touches=null);
let mouse=null;stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&lf){mouse=point(e);stage.setPointerCapture(e.pointerId)}});stage.addEventListener('pointermove',e=>{if(mouse){let p=point(e);x+=(p.x-mouse.x)/stage.clientWidth;y+=(p.y-mouse.y)/stage.clientHeight;mouse=p;geometry()}});stage.addEventListener('pointerup',()=>mouse=null);
async function toBlobURL(url,type){const response=await fetch(url);if(!response.ok)throw Error('โหลดตัวประมวลผลไม่สำเร็จ');return URL.createObjectURL(new Blob([await response.arrayBuffer()],{type}))}
$('render').onclick=async()=>{if(!vf||!lf)return;const button=$('render');button.disabled=true;$('save').style.display='none';$('progress').style.display='block';$('progress').value=0;try{if(!window.FFmpegWASM)throw Error('โหลด FFmpeg ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต');if(!ff){$('status').textContent='กำลังโหลดตัวประมวลผล (ครั้งแรกอาจใช้เวลาสักครู่)…';ff=new FFmpegWASM.FFmpeg();ff.on('progress',({progress})=>{if(Number.isFinite(progress))$('progress').value=clamp(progress*100,0,100);$('status').textContent='กำลังสร้างวิดีโอ '+Math.round($('progress').value)+'%'});const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';await ff.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')})}
$('status').textContent='กำลังอ่านวิดีโอ…';await ff.writeFile('source.mp4',new Uint8Array(await vf.arrayBuffer()));await ff.writeFile('mark.png',new Uint8Array(await lf.arrayBuffer()));const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)throw Error('ไม่สามารถอ่านขนาดวิดีโอได้');let logoW=Math.max(2,Math.round(vw*w/2)*2);const px=Math.round(vw*x),py=Math.round(vh*y);const filter=`[1:v]format=rgba,scale=${logoW}:-2,setsar=1[wm];[0:v][wm]overlay=${px}:${py}:format=auto,format=yuv420p[v]`;
const rc=await ff.exec(['-y','-i','source.mp4','-i','mark.png','-filter_complex',filter,'-map','[v]','-map','0:a?','-c:v','libx264','-preset','ultrafast','-crf','25','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','result.mp4']);if(rc!==0)throw Error('FFmpeg ประมวลผลไม่สำเร็จ (รหัส '+rc+')');const data=await ff.readFile('result.mp4');if(data.length<1000)throw Error('วิดีโอผลลัพธ์ไม่สมบูรณ์');if(outURL)URL.revokeObjectURL(outURL);outURL=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));const save=$('save');save.href=outURL;save.download='videomark-'+Date.now()+'.mp4';save.style.display='block';$('status').textContent='สร้างวิดีโอสำเร็จ กดบันทึก / แชร์วิดีโอ';await ff.deleteFile('source.mp4');await ff.deleteFile('mark.png');await ff.deleteFile('result.mp4')
}catch(err){$('status').textContent='เกิดข้อผิดพลาด: '+(err?.message||String(err))+'\nหากใช้ iPhone และคลิปยาวหรือความละเอียดสูง เบราว์เซอร์อาจมีหน่วยความจำไม่พอ';console.error(err)}finally{button.disabled=false}};
</script></body></html>
